# Colar em Settings > Secrets do Streamlit Cloud (ou em .streamlit\secrets.toml no PC), trocando os valores.
TENANT_ID     = "..."
CLIENT_ID     = "..."
CLIENT_SECRET = "..."
SITE_HOST     = "suaempresa.sharepoint.com"
SITE_NAME     = "NomeDoSite"            # o site onde estão as 3 listas
LISTA_FUNCIONARIOS = "RotasFuncionarios"
LISTA_FROTAS       = "RotasFrotas"
LISTA_CONFIG       = "RotasConfig"

# Usuários: senha_sha256 gerada com  python gerar_senha.py
[usuarios.admin]
senha_sha256 = "..."
perfil = "admin"            # cadastra, altera, exclui e recalcula

[usuarios.consulta]
senha_sha256 = "..."
perfil = "visualizador"     # só consulta
